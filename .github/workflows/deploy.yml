name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job gets read-only contents by default. Only the
# deploy job (which runs no npm code) gets the Pages / OIDC permissions.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (resolved from the release tag in
# the trailing comment). To update: look up the new tag's commit SHA, e.g.
#   gh api repos/actions/checkout/git/ref/tags/v4.4.0
jobs:
  build:
    # Runs `npm ci` (third-party install scripts) — deliberately has no
    # pages/id-token permission, only the workflow-level contents: read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Hands dist/ to the deploy job as the "github-pages" artifact.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No `enablement: true`: creating the Pages site needs a token with
      # admin/Pages-write on the repo, which GITHUB_TOKEN never has, so it
      # could only fail. Enable Pages once per repo instead (README step 2:
      # `gh api repos/<owner>/<repo>/pages -X POST -f build_type=workflow`).
      # configure-pages then just fails fast if that step was skipped.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
